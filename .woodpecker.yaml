# tap —— LLM 网关。Woodpecker CI：构建 linux/amd64 镜像推送到
# docker.test4x.com/xgfan/tap，再把 k3s 的 Deployment 滚动到新的 8 位 SHA。
# 对齐 homelab app CI 约定（见 github.com/XGFan/{pio,chrome-proxy}）。
# 组织级 secret（docker_username / docker_password / kubeconfig / bark_token）
# 由 org 继承，无需 repo 级 secret。镜像在 infra 仓库的 k8s/apps/tap/tap.yaml
# 用 :latest 作模板，本流水线只 build/push;部署由 infra Flux image automation(见 k8s/CLAUDE.md)。
when:
  branch: master
  event: push

steps:
  - name: build
    image: docker.test4x.com/xgfan/plugin-docker-buildx-check
    settings:
      repo: docker.test4x.com/xgfan/tap
      registry: docker.test4x.com
      tags:
        - "${CI_COMMIT_SHA:0:8}"
        - latest
      platforms: linux/amd64
      mtu: 1450
      cache_from: docker.test4x.com/xgfan/tap:cache
      cache_to: docker.test4x.com/xgfan/tap:cache
      # WOODPECKER_ENVIRONMENT 注入 NPM_CONFIG_REGISTRY 到 step 容器，但**不**进
      # `docker build`；显式转成 build-arg，Dockerfile 的 ARG NPM_CONFIG_REGISTRY
      # 才会用上集群内的 verdaccio 代理。
      build_args_from_env:
        - NPM_CONFIG_REGISTRY
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password

  # 把 infra 仓库里该 app 的 image tag 改成本次构建的 sha8 并 push —— 部署由这一步决定。
  # 失败必须让流水线变红(它就是部署本身)。见 infra k8s/apps/woodpecker/plugins/flux-bump.sh。
  - name: flux-bump
    image: docker.test4x.com/xgfan/plugin-flux-bump
    settings:
      repo: docker.test4x.com/xgfan/tap
      tag: "${CI_COMMIT_SHA:0:8}"
      ssh_key:
        from_secret: infra_deploy_key
  # deploy 步骤已移除:改由 infra 仓库 Flux image automation 部署(ImageRepository 扫 registry →
  # ImagePolicy 选最新 master-<sha>-<num> → ImageUpdateAutomation 写回 infra git → apps 部署)。
  # 叫 Flux 立刻拉 git(否则等 GitRepository 的 1m 轮询)。agent 是 k8s backend、
  # 跑在集群内,直连 ClusterIP 即可。见 infra k8s/apps/flux2bark/README.md。
  - name: trigger-flux
    image: alpine:3.20
    failure: ignore # webhook 挂了不该让流水线变红
    environment:
      FLUX_URL:
        from_secret: flux_webhook_url
    commands:
      - apk add --no-cache curl >/dev/null
      - curl -sf -X POST "$FLUX_URL" -d '{}' && echo "[flux] git pull triggered"
  - name: notify-success
    image: docker.test4x.com/xgfan/plugin-bark
    failure: ignore
    settings:
      token:
        from_secret: bark_token
      status: success

  - name: notify-failure
    image: docker.test4x.com/xgfan/plugin-bark
    failure: ignore
    settings:
      token:
        from_secret: bark_token
      status: failure
    when:
      - status: [failure]
